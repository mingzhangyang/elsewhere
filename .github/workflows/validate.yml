name: Validate release candidate
on:
  # A branch push that also updates a pull request used to start a second full matrix and
  # browser job. Pull requests cover those commits; a push to main still validates on its own.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Fail style before the test/build gate so a Prettier miss does not pay for a full validate.
      - run: npm run format:check
      - run: npm run validate
      - run: node --test scripts/check-audit.test.mjs
      - run: node scripts/check-audit.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: elsewhere-preview
          path: dist/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # actions/cache saves the Playwright browser download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Headless Firefox cannot create a WebGL context without a display server (Chromium uses its bundled
      # SwiftShader). Xvfb, installed by --with-deps above, gives it one; it then renders with Mesa's llvmpipe.
      - run: xvfb-run --auto-servernum npm run test:browser
        env:
          CSS_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
