name: One-shot SM3-A code formatter
on:
  push:
    branches:
      - feat/sky-moments-sm3-a-artwork
    paths:
      - .github/workflows/sm3a-one-shot.yml
permissions:
  contents: write
jobs:
  format-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prettier SM3-A files and remove the temporary formatter
        run: |
          npx prettier --write src/lib/skyArtwork.ts src/moment/skyChart.ts tests/skyArtwork.test.ts tests/skyChartDrawing.test.ts tests/browser/sky-artwork.spec.ts docs/SKY-CHART-ARTWORK.md docs/SCIENCE.md docs/SKY-MOMENT-TIME-FIXTURES.md
          git rm .github/workflows/sm3a-one-shot.yml
          git add src/lib/skyArtwork.ts src/moment/skyChart.ts tests/skyArtwork.test.ts tests/skyChartDrawing.test.ts tests/browser/sky-artwork.spec.ts docs/SKY-CHART-ARTWORK.md docs/SCIENCE.md docs/SKY-MOMENT-TIME-FIXTURES.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format SM3-A artwork implementation'
          git push origin HEAD:feat/sky-moments-sm3-a-artwork
