name: Release Sky Engine
on:
  push:
    tags: ['sky-engine-v*']
permissions:
  contents: read
concurrency:
  group: sky-engine-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag and merged source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const p = JSON.parse(readFileSync('packages/sky-engine/package.json', 'utf8')); if (process.env.GITHUB_REF_NAME !== 'sky-engine-v' + p.version) throw new Error('Tag must match package version');"
      - run: npm ci
      - run: npm run format:check
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium tests/browser/sky-engine-distribution.spec.ts
      - name: Verify release checksums
        working-directory: dist-sdk/release
        run: sha256sum --check SHA256SUMS
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-sdk/release/* --verify-tag --latest=false \
            --title "Sky Engine ${GITHUB_REF_NAME#sky-engine-}" \
            --notes "Browser ESM, npm archive with declarations and HYG catalog, optional landscape and NASA Moon texture archives, notices, and SHA-256 manifest. See packages/sky-engine/README.md at this tag."
